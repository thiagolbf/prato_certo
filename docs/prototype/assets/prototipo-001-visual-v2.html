<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Protótipo PF e Marmitas · Visual v2</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,700;6..12,800&display=swap">
<!--
  Wireframe navegável da SPEC-UI-001 (docs/prototype/SPEC-UI-001-controle-vendas-pf-marmitas.md).
  Versão visual v2 do wireframe prototipo-001.html: mesmas telas, estados e fluxos; só muda o tratamento visual.
  Direção "tomate suave" (SPEC-UI-001 seção 10, direção B dessaturada), com estrutura colorida (topo tomate, fundo areia), fonte Nunito Sans, contraste WCAG AA.
  O painel lateral troca tela, estado e perfil; os IDs UI-XX.estado batem com a SPEC-UI.
  Dados de exemplo fictícios, coerentes com os cenários do PRD-001.
-->
<style>
  /* Layout: moldura de celular (ou coluna central no computador) ao lado do painel de controles do protótipo.
     Direção "tomate suave" v2: estrutura colorida — topo em tomate, fundo areia, navegação com pílula tomate.
     Tema claro único, de propósito: o app é usado no salão iluminado. */
  :root {
    --desk: #E4D0BE;      /* fundo fora do app */
    --canvas: #F3E3D3;    /* fundo das telas */
    --paper: #FFFFFF;     /* cartões, barras, campos */
    --ink: #2E2622;       /* texto */
    --muted: #66574D;     /* texto secundário */
    --line: #E6D2C3;      /* divisórias decorativas */
    --strong: #86766A;    /* borda de campo e de botão (3:1) */
    --soft: #F8DCCD;      /* realce leve, seleção */
    --press: #F1CCB9;     /* toque em botão claro */
    --pri: #A5452F;       /* tomate apagado: ação principal */
    --pri-press: #8A3824;
    --pri-ring: rgba(165, 69, 47, .22);
    --on-pri-sub: #F6DCD2;  /* texto secundário sobre tomate (4.6:1) */
    --tabs-bg: #EBD2C0;
    --on-pri: #FFFFFF;
    --bezel: #2B2420;
    --bezel-ink: #EFE4DA;
    --err: #A3302A;  --errbg: #FBEAE7;  --errline: #E7B7B0;
    --ok: #2E6A3A;   --okbg: #E7F1E5;   --okline: #B5D3B3;
    --warn: #7A5200; --warnbg: #FBF0D6; --warnline: #E6CE92;
    --info: #2E5570; --infobg: #E6EEF3; --infoline: #B4CAD8;
    --skel-a: #EAD3C1; --skel-b: #F6E8DC;
    --scrim: rgba(46, 38, 34, .45);
    --shadow: 0 1px 2px rgba(46, 38, 34, .06), 0 2px 8px rgba(46, 38, 34, .05);
    --shadow-up: 0 12px 32px rgba(46, 38, 34, .16);
    --font: "Nunito Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    --mono: ui-monospace, Consolas, monospace;
    --r-sm: 10px; --r: 14px; --r-lg: 18px;
    --t: 160ms ease-out;
    color-scheme: light;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 16px/1.45 var(--font); color: var(--ink); background: var(--desk);
         display: flex; gap: 24px; padding: 20px 16px; justify-content: center; align-items: flex-start; flex-wrap: wrap;
         -webkit-font-smoothing: antialiased; }
  button, input, select, textarea { font: inherit; color: inherit; }
  :focus-visible { outline: 3px solid var(--pri); outline-offset: 2px; }
  h1, h2, h3 { text-wrap: balance; }

  /* Painel de controles do protótipo (não faz parte do app) */
  #ctl { width: 320px; background: var(--paper); border: 1px solid var(--line); border-radius: var(--r-lg); padding: 18px;
         position: sticky; top: 20px; box-shadow: var(--shadow); }
  #ctl h1 { font-size: 18px; font-weight: 800; margin: 0 0 4px; }
  #ctl label { display: block; margin: 12px 0 4px; font-weight: 700; font-size: 14px; }
  #ctl select { width: 100%; min-height: 42px; border: 1px solid var(--strong); border-radius: var(--r-sm); padding: 0 10px; background: var(--paper); }
  #ctl fieldset { border: 1px solid var(--line); border-radius: var(--r-sm); margin: 12px 0 0; padding: 8px 12px; }
  #ctl legend { font-weight: 700; font-size: 14px; padding: 0 4px; }
  #ctl fieldset label { display: inline-flex; gap: 6px; margin: 4px 16px 4px 0; font-weight: 400; }
  #ctl .chk { display: flex; gap: 8px; font-weight: 400; align-items: flex-start; }
  #ctl input[type=radio], #ctl input[type=checkbox] { accent-color: var(--pri); }
  #info { margin-top: 16px; font-size: 14px; border-top: 1px solid var(--line); padding-top: 12px; }
  #info dt { font-weight: 700; margin-top: 8px; }
  #info dd { margin: 2px 0 0; color: var(--muted); }
  #dispNota { font-size: 13px; color: var(--muted); margin: 6px 0 0; }

  /* Moldura do celular */
  .phone { width: 375px; height: 740px; background: var(--canvas); border: 8px solid var(--bezel); border-radius: 40px; overflow: hidden;
           display: flex; flex-direction: column; position: relative; box-shadow: var(--shadow-up); }
  .statebar { background: var(--bezel); color: var(--bezel-ink); font: 12px/1 var(--mono); padding: 6px 14px 8px; }
  .screen { flex: 1; display: flex; flex-direction: column; position: relative; min-height: 0; background: var(--canvas); }

  /* Casca do app */
  .top { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 10px 16px; background: var(--paper); border-bottom: 1px solid var(--line); }
  .top h1 { font-size: 19px; font-weight: 800; margin: 0; letter-spacing: -.01em; }
  .top .who { font-size: 13px; color: var(--muted); display: block; }
  .content { flex: 1; overflow: auto; padding: 16px; }
  .nav { display: flex; background: var(--paper); border-top: 1px solid var(--line); }
  .nav button { flex: 1; min-height: 58px; border: 0; background: none; color: var(--muted); font-size: 13px; font-weight: 700;
                border-top: 3px solid transparent; cursor: pointer; transition: background var(--t), color var(--t); }
  .nav button:hover { color: var(--ink); }
  .nav button[aria-current="page"] { color: var(--pri); border-top-color: var(--pri); background: var(--soft); }

  /* Botões */
  .btn { min-height: 44px; border: 1.5px solid var(--strong); background: var(--paper); color: var(--ink); border-radius: 12px; padding: 0 16px;
         font-weight: 700; cursor: pointer; transition: background var(--t), border-color var(--t), color var(--t); }
  .btn:hover { background: var(--soft); }
  .btn:active { background: var(--press); }
  .btn.pri { background: var(--pri); border-color: var(--pri); color: var(--on-pri); box-shadow: 0 2px 6px rgba(165, 69, 47, .25); }
  .btn.pri:hover, .btn.pri:active { background: var(--pri-press); border-color: var(--pri-press); }
  .btn.ghost { border-color: transparent; background: none; color: var(--pri); text-decoration: underline; text-underline-offset: 3px; }
  .btn.sm { min-height: 38px; padding: 0 12px; font-size: 14px; }
  .btn.xl { min-height: 64px; font-size: 20px; width: 100%; border-radius: var(--r); }
  .btn.full { width: 100%; }
  .btn.danger { border-color: var(--err); color: var(--err); }
  .btn.danger:hover { background: var(--errbg); }
  .btn.danger.pri { background: var(--err); color: var(--on-pri); box-shadow: none; }
  .btn:disabled, .btn:disabled:hover { opacity: .45; cursor: not-allowed; background: var(--paper); }
  .btn.pri:disabled, .btn.pri:disabled:hover { background: var(--pri); }
  .lnk { background: none; border: 0; color: var(--pri); text-decoration: underline; text-underline-offset: 3px; min-height: 44px; padding: 0 4px; cursor: pointer; font-weight: 700; }

  /* Avisos */
  .banner { border-radius: 12px; padding: 12px 14px; margin: 0 0 12px; border: 1px solid; font-size: 15px; }
  .banner.err { background: var(--errbg); border-color: var(--errline); color: var(--err); }
  .banner.ok { background: var(--okbg); border-color: var(--okline); color: var(--ok); }
  .banner.warn { background: var(--warnbg); border-color: var(--warnline); color: var(--warn); }
  .banner.info { background: var(--infobg); border-color: var(--infoline); color: var(--info); }
  .banner .acts { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
  .shellbanner { margin: 10px 16px 0; }
  .sub { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 12px; font-weight: 700; }
  .tag { display: inline-block; font-size: 12px; font-weight: 700; padding: 3px 9px; border-radius: 999px; background: var(--soft); color: var(--muted); white-space: nowrap; }
  .tag.err { background: var(--errbg); color: var(--err); }
  .tag.warn { background: var(--warnbg); color: var(--warn); }
  .muted { color: var(--muted); }
  .center { text-align: center; padding: 32px 8px; }
  .big { font-size: 20px; font-weight: 800; margin: 0 0 8px; }
  .skel { height: 64px; border-radius: var(--r); margin-bottom: 10px;
          background: linear-gradient(90deg, var(--skel-a) 0 30%, var(--skel-b) 50%, var(--skel-a) 70%); background-size: 200% 100%;
          animation: skel 1.4s ease-in-out infinite; }
  @keyframes skel { from { background-position: 100% 0; } to { background-position: -100% 0; } }

  /* Registro (UI-02 / UI-03) */
  .grade { display: flex; flex-direction: column; gap: 10px; }
  .prato { display: flex; align-items: center; gap: 10px; background: var(--paper); border: 1px solid var(--line); border-radius: var(--r-lg);
           padding: 10px 10px 10px 14px; box-shadow: var(--shadow); }
  .pnome { flex: 1; font-weight: 800; font-size: 17px; line-height: 1.25; }
  .fmts { display: flex; gap: 8px; }
  .item { min-width: 92px; min-height: 64px; border: 1.5px solid var(--pri); border-radius: var(--r); background: var(--paper); color: var(--pri);
          font-weight: 800; font-size: 17px; cursor: pointer; transition: background var(--t); }
  .item:hover { background: var(--soft); }
  .item:active { background: var(--press); }
  .item:disabled { opacity: .4; cursor: not-allowed; background: var(--paper); }
  .item.vago { border: 0; background: none; display: inline-block; }
  .item small { display: block; font-size: 13px; font-weight: 600; color: var(--muted); }
  .toast { position: absolute; left: 16px; right: 16px; bottom: 72px; padding: 14px 16px; border-radius: var(--r); font-weight: 700; border: 1px solid;
           box-shadow: 0 6px 20px rgba(46, 38, 34, .14); }
  .toast.ok { background: var(--okbg); border-color: var(--okline); color: var(--ok); }
  .scrim { position: absolute; inset: 0; background: var(--scrim); }
  .sheet { position: absolute; left: 0; right: 0; bottom: 0; background: var(--paper); border-radius: 24px 24px 0 0; padding: 22px 18px 18px;
           display: flex; flex-direction: column; gap: 12px; max-height: 88%; overflow: auto; box-shadow: 0 -8px 24px rgba(46, 38, 34, .12); }
  .sheet::before { content: ""; position: absolute; top: 8px; left: 50%; width: 40px; height: 4px; margin-left: -20px; border-radius: 4px; background: var(--line); }
  .sheet h2 { margin: 0; font-size: 21px; font-weight: 800; }
  .stepper { display: flex; align-items: center; justify-content: center; gap: 20px; }
  .step { width: 72px; min-height: 72px; font-size: 32px; border-radius: 50%; border-color: var(--pri); color: var(--pri); }
  .qtd { font-size: 44px; font-weight: 800; min-width: 64px; text-align: center; font-variant-numeric: tabular-nums; }
  .hint { margin: 0; text-align: center; font-size: 15px; color: var(--muted); }
  .hint.warn { color: var(--warn); font-weight: 700; }

  /* Listas e cartões */
  .list { list-style: none; margin: 0; padding: 0; background: var(--paper); border: 1px solid var(--line); border-radius: var(--r); }
  .list li { display: flex; gap: 8px; align-items: center; padding: 12px 14px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
  .list li:last-child { border-bottom: 0; }
  .list .time { font-variant-numeric: tabular-nums; color: var(--muted); width: 44px; }
  .grow { flex: 1; }
  .qty { font-weight: 800; font-variant-numeric: tabular-nums; }
  .cancel .grow, .cancel .qty, .cancel .val { text-decoration: line-through; color: var(--muted); }
  .card { background: var(--paper); border: 1px solid var(--line); border-radius: var(--r); padding: 12px 14px; margin-bottom: 10px; box-shadow: var(--shadow); }
  .card.cancel { background: var(--canvas); box-shadow: none; }
  .card .l1 { display: flex; justify-content: space-between; font-size: 14px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .card .l2 { font-weight: 800; margin: 4px 0; }
  .card .l3 { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .card .why { font-size: 14px; color: var(--muted); margin-top: 6px; text-decoration: none; }

  /* Relatórios */
  .datenav { display: flex; gap: 8px; margin-bottom: 14px; }
  .datenav .datebtn { flex: 1; }
  .datenav .icon { width: 48px; padding: 0; font-size: 22px; }
  .kpis { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 14px; }
  .kpi { background: var(--paper); border: 1px solid var(--line); border-radius: var(--r); padding: 10px 12px; }
  .kpi small { display: block; color: var(--muted); font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .04em; }
  .kpi strong { font-size: 18px; font-weight: 800; font-variant-numeric: tabular-nums; }
  .kpi.total { grid-column: 1 / -1; background: var(--soft); border-color: transparent; }
  .kpi.total strong { font-size: 24px; color: var(--pri); }
  h3 { font-size: 13px; font-weight: 800; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; margin: 18px 0 8px; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; background: var(--paper); }
  th, td { text-align: left; padding: 8px; border-bottom: 1px solid var(--line); }
  th { font-size: 12px; color: var(--muted); font-weight: 700; background: var(--canvas); }
  td.n, th.n { text-align: right; font-variant-numeric: tabular-nums; }

  /* Formulários */
  .field { display: flex; flex-direction: column; gap: 5px; margin-bottom: 14px; }
  .field span { font-weight: 700; font-size: 14px; }
  .field input, .field select, .field textarea { min-height: 46px; border: 1.5px solid var(--strong); border-radius: 12px; padding: 8px 12px; background: var(--paper);
    transition: border-color var(--t), box-shadow var(--t); }
  .field input:focus, .field select:focus, .field textarea:focus { outline: none; border-color: var(--pri); box-shadow: 0 0 0 3px var(--pri-ring); }
  .field.bad input, .field.bad textarea, .field.bad select { border-color: var(--err); }
  .field .msg { color: var(--err); font-size: 14px; font-weight: 700; }
  .seg { display: flex; gap: 8px; }
  .seg .btn { flex: 1; }
  .seg .btn[aria-pressed="true"] { background: var(--pri); border-color: var(--pri); color: var(--on-pri); }
  .tabs { display: flex; gap: 6px; margin-bottom: 14px; padding: 4px; background: var(--soft); border-radius: 14px; }
  .tabs .btn { flex: 1; font-size: 14px; padding: 0 6px; border-color: transparent; background: none; color: var(--muted); }
  .tabs .btn:hover { color: var(--ink); }
  .tabs .btn[aria-current="page"] { background: var(--paper); color: var(--pri); box-shadow: var(--shadow); }
  .rowact { display: flex; gap: 6px; }
  .off .grow { color: var(--muted); }
  .check { display: flex; align-items: center; gap: 10px; min-height: 48px; border-bottom: 1px solid var(--line); }
  .check input { width: 24px; height: 24px; accent-color: var(--pri); }
  .login { flex: 1; padding: 32px 22px; display: flex; flex-direction: column; justify-content: center; background: var(--canvas); }
  .login h1 { font-size: 26px; font-weight: 800; margin: 0 0 24px; text-align: center; color: var(--pri); }
  .menu a, .menu button { display: block; width: 100%; text-align: left; min-height: 50px; border: 0; border-bottom: 1px solid var(--line); background: none;
                          font-weight: 700; cursor: pointer; padding: 0 6px; border-radius: 8px; }
  .menu a:hover, .menu button:hover { background: var(--soft); }

  /* Computador: a mesma tela numa coluna de até 480 px, centralizada */
  body.desk main { flex: 1 1 640px; min-width: 0; max-width: 1280px; }
  .phone.desk { width: 100%; height: 760px; border: 1px solid var(--strong); border-radius: 12px; background: var(--desk); }
  .phone.desk .statebar { background: var(--line); color: var(--ink); padding: 10px 14px; display: flex; gap: 10px; align-items: center; }
  .phone.desk .statebar::before { content: ""; width: 42px; height: 10px; flex: none;
    background: radial-gradient(circle, var(--strong) 4px, transparent 5px) 0 0 / 14px 10px repeat-x; }
  .phone.desk .screen { width: 100%; max-width: 480px; margin: 0 auto; border-inline: 1px solid var(--line); }

  /* v2: estrutura colorida */
  .top { background: var(--pri); border-bottom: 0; color: var(--on-pri); }
  .top .who { color: var(--on-pri-sub); }
  .top .lnk { color: var(--on-pri); }
  .top :focus-visible { outline-color: var(--on-pri); }
  .nav { padding: 6px; gap: 6px; box-shadow: 0 -2px 10px rgba(46, 38, 34, .06); }
  .nav button { border-top: 0; border-radius: 12px; min-height: 50px; }
  .nav button[aria-current="page"] { background: var(--soft); color: var(--pri-press); }
  .tabs { background: var(--tabs-bg); }
  .tabs .btn { color: var(--ink); }
  .tabs .btn[aria-current="page"] { color: var(--pri-press); }
  .kpi.total { background: var(--pri); color: var(--on-pri); }
  .kpi.total small { color: var(--on-pri-sub); }
  .kpi.total strong { color: var(--on-pri); }
  .item { background: var(--paper); }
  .login h1 { color: var(--pri); }
  .phone.desk .statebar { background: var(--line); }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { transition: none !important; animation: none !important; }
  }
  @media (max-width: 760px) {
    body { padding: 8px; gap: 12px; }
    #ctl { width: 100%; position: static; }
    .phone { width: 100%; height: 700px; border-width: 6px; border-radius: 28px; }
  }
</style>
</head>
<body>

<aside id="ctl" aria-label="Controles do protótipo">
  <h1>Protótipo · PRD-001</h1>
  <div class="muted" style="font-size:14px">Versão visual v2 · SPEC-UI-001. Mesmas telas e estados do wireframe.</div>
  <label for="selTela">Tela</label>
  <select id="selTela"></select>
  <label for="selEstado">Estado</label>
  <select id="selEstado"></select>
  <fieldset>
    <legend>Perfil autenticado</legend>
    <label><input type="radio" name="perfil" value="Operador" checked> Operador</label>
    <label><input type="radio" name="perfil" value="ADMIN"> ADMIN</label>
  </fieldset>
  <fieldset>
    <legend>Dispositivo</legend>
    <label><input type="radio" name="disp" id="dispCel" value="cel" checked> Celular</label>
    <label><input type="radio" name="disp" id="dispCol" value="coluna"> Computador</label>
    <p id="dispNota"></p>
  </fieldset>
  <label class="chk"><input type="checkbox" id="chkHerdado"> Cardápio de hoje é herdado (aviso global ao ADMIN, RN-09)</label>
  <dl id="info"></dl>
</aside>

<main>
  <div class="phone">
    <div class="statebar" id="sb"></div>
    <div class="screen" id="screen"></div>
  </div>
</main>

<script>
/* ---------- Dados de exemplo (coerentes com os cenários do PRD-001) ---------- */
const HOJE = 'seg 28/09';
const PRATOS = [
  { nome: 'Frango grelhado', prot: 'Frango', g: 150, itens: [['PF', 18], ['Marmita', 22]] },
  { nome: 'Bife acebolado', prot: 'Carne bovina', g: 180, itens: [['PF', 20], ['Marmita', 24]] },
  { nome: 'Peixe frito', prot: 'Peixe', g: 160, itens: [['PF', 21]] },
  { nome: 'Omelete', prot: 'Ovo', g: 120, itens: [['PF', 15], ['Marmita', 18]] },
];
const HERDADO = [
  { nome: 'Frango grelhado', itens: [['PF', 18], ['Marmita', 22]] },
  { nome: 'Bife acebolado', itens: [['PF', 20]] },
  { nome: 'Omelete', itens: [['PF', 15]] },
];
const MINHAS = [['11:58', 'Frango grelhado', 'PF', 1], ['11:52', 'Bife acebolado', 'Marmita', 2], ['11:40', 'Omelete', 'PF', 1], ['11:31', 'Frango grelhado', 'Marmita', 3]];
const VENDAS = [
  ['12:04', 'Maria', 'Frango grelhado', 'PF', 2, 18], ['11:58', 'João', 'Frango grelhado', 'PF', 1, 18],
  ['11:52', 'João', 'Bife acebolado', 'Marmita', 2, 24], ['11:40', 'Maria', 'Omelete', 'PF', 1, 15],
  ['11:31', 'João', 'Frango grelhado', 'Marmita', 3, 22],
];
const FECH_HOJE = [['Frango grelhado', 'Frango', 150, 'PF', 10, 18], ['Frango grelhado', 'Frango', 150, 'Marmita', 4, 22], ['Bife acebolado', 'Carne bovina', 180, 'PF', 6, 20]];
const FECH_1509 = [['Frango grelhado', 'Frango', 150, 'PF', 22, 17], ['Feijoada', 'Carne suína', 200, 'PF', 18, 22], ['Feijoada', 'Carne suína', 200, 'Marmita', 12, 26], ['Omelete', 'Ovo', 120, 'PF', 26, 15]];

const S = { disp: 'cel', tela: 'UI-02', estado: 'default', perfil: 'Operador', herdado: false, item: { prato: 'Frango grelhado', fmt: 'PF' }, qtd: 1, mais: false };

/* ---------- Helpers ---------- */
const brl = v => 'R$ ' + v.toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
// Gramas como no PRD; kg ao lado porque é a unidade em que a proteína é comprada
const gr = v => v.toLocaleString('pt-BR') + ' g' + (v >= 1000 ? ` <span class="muted">(${(v / 1000).toLocaleString('pt-BR', { maximumFractionDigits: 1 })} kg)</span>` : '');
const go = (t, st = 'default') => `data-go="${t}" data-st="${st}"`;
const btn = (label, attrs = '', cls = '') => `<button class="btn ${cls}" ${attrs}>${label}</button>`;

function grade(pratos = PRATOS, disabled = false) {
  // Colunas fixas (PF sempre à esquerda, Marmita à direita) e pratos em ordem alfabética:
  // o polegar aprende a posição. Preço visível para o operador cobrar (RN-40).
  const slot = (p, f) => {
    const it = p.itens.find(([x]) => x === f);
    return it
      ? `<button class="item" data-act="abrir" data-prato="${p.nome}" data-fmt="${f}" ${disabled ? 'disabled' : ''}>${f}<small>${brl(it[1])}</small></button>`
      : '<span class="item vago" aria-hidden="true"></span>';
  };
  const ord = [...pratos].sort((a, b) => a.nome.localeCompare(b.nome, 'pt-BR'));
  return `<div class="grade">${ord.map(p => `<div class="prato"><span class="pnome">${p.nome}</span><span class="fmts">${slot(p, 'PF')}${slot(p, 'Marmita')}</span></div>`).join('')}</div>`;
}

/* ---------- UI-07 ---------- */
// Mês de exemplo: setembro/2026 até hoje (28/09), sem domingos. Gerado dia a dia para que
// a quebra por dia some exatamente o total do mês.
const MES = (() => {
  const wdN = ['dom', 'seg', 'ter', 'qua', 'qui', 'sex', 'sáb'], dias = [], itens = {};
  for (let d = 1; d <= 28; d++) {
    const wd = (d + 1) % 7; // 01/09/2026 é terça
    if (wd === 0) continue;
    const vendas = [
      ['Frango grelhado', 'Frango', 150, 'PF', 8 + (d * 3) % 6, 18], ['Frango grelhado', 'Frango', 150, 'Marmita', 3 + d % 4, 22],
      ['Bife acebolado', 'Carne bovina', 180, 'PF', 4 + (d * 7) % 5, 20], ['Bife acebolado', 'Carne bovina', 180, 'Marmita', 2 + d % 3, 24],
      ['Peixe frito', 'Peixe', 160, 'PF', wd === 5 ? 12 : 3 + d % 2, 21],
      ['Omelete', 'Ovo', 120, 'PF', 2 + d % 3, 15], ['Omelete', 'Ovo', 120, 'Marmita', 1 + d % 2, 18],
    ];
    let un = 0, fat = 0;
    vendas.forEach(v => { un += v[4]; fat += v[4] * v[5]; const k = v[0] + '|' + v[3]; itens[k] = itens[k] ? (itens[k][4] += v[4], itens[k]) : v.slice(); });
    dias.push([`${wdN[wd]} ${String(d).padStart(2, '0')}/09`, un, fat]);
  }
  return { dias: dias.reverse(), itens: Object.values(itens) };
})();
const modoSeg = (modo) => `<div class="seg" style="margin-bottom:12px" role="group" aria-label="Período"><button class="btn" ${go('UI-07', 'default')} aria-pressed="${modo === 'dia'}">Dia</button><button class="btn" ${go('UI-07', 'mes')} aria-pressed="${modo === 'mes'}">Mês</button></div>`;
const porDia = () => `<h3>Por dia</h3><table><thead><tr><th>Dia</th><th class="n">Unid.</th><th class="n">Faturamento</th></tr></thead><tbody>${MES.dias.map(([l, u, f]) => `<tr ${go('UI-07', 'dataPassada')} style="cursor:pointer"><td><u>${l}</u></td><td class="n">${u}</td><td class="n">${brl(f)}</td></tr>`).join('')}</tbody></table>`;

function fechBody(dados, label, prox, extraTop = '', modo = 'dia') {
  let fPF = 0, fM = 0, uPF = 0, uM = 0; const prot = {}, porPrato = {}, porItem = [];
  dados.forEach(([p, pr, g, f, q, v]) => {
    if (f === 'PF') { fPF += q * v; uPF += q; } else { fM += q * v; uM += q; }
    prot[pr] = (prot[pr] || 0) + g * q;
    porPrato[p] = porPrato[p] || { PF: 0, Marmita: 0 }; porPrato[p][f] += q;
    porItem.push([p, f, q]);
  });
  return `${modoSeg(modo)}${datenav(label, prox)}${extraTop}
    <h3>Faturamento</h3>
    <div class="kpis"><div class="kpi"><small>PF</small><strong>${brl(fPF)}</strong></div><div class="kpi"><small>Marmita</small><strong>${brl(fM)}</strong></div><div class="kpi total"><small>Total</small><strong>${brl(fPF + fM)}</strong></div></div>
    <h3>Unidades</h3>
    <div class="kpis"><div class="kpi"><small>PF</small><strong>${uPF}</strong></div><div class="kpi"><small>Marmita</small><strong>${uM}</strong></div><div class="kpi total"><small>Total</small><strong>${uPF + uM}</strong></div></div>
    <h3>Proteína consumida (estimada)</h3>
    <table><thead><tr><th>Proteína</th><th class="n">Consumo</th></tr></thead><tbody>${Object.entries(prot).map(([k, v]) => `<tr><td>${k}</td><td class="n">${gr(v)}</td></tr>`).join('')}</tbody></table>
    <h3>Por prato</h3>
    <table><thead><tr><th>Prato</th><th class="n">PF</th><th class="n">Marm.</th><th class="n">Total</th></tr></thead><tbody>${Object.entries(porPrato).map(([k, v]) => `<tr><td>${k}</td><td class="n">${v.PF}</td><td class="n">${v.Marmita}</td><td class="n"><strong>${v.PF + v.Marmita}</strong></td></tr>`).join('')}</tbody></table>
    <h3>Por item de cardápio</h3>
    <table><thead><tr><th>Item</th><th class="n">Unid.</th></tr></thead><tbody>${porItem.map(([p, f, q]) => `<tr><td>${p} · ${f}</td><td class="n">${q}</td></tr>`).join('')}</tbody></table>
    ${modo === 'mes' ? porDia() : `<p style="margin-top:16px">${btn('Ver vendas desta data', go('UI-05'), 'full')}</p>`}`;
}

}

    editando: { d: 'Seleção dos itens ativos; desativados não aparecem (RN-12). Aviso de que vendas já feitas não mudam (RN-10)', o: 'Derivado de RN-10, RN-12, CA-09, CA-48', r: () => card(cardEdit('editando')) },

    sucesso: { d: 'Gravado como próprio. A tela de registro NÃO se atualiza sozinha: o ADMIN é orientado a avisar o balcão', o: 'Derivado de RN-10, CA-09, §7.2', r: () => shell({ title: 'Cardápio', nav: 'UI-08', noBanner: true, body: `${datenav(HOJE)}<div class="sub"><span>Cardápio de hoje</span><span class="tag">Próprio</span></div>${cardList(PRATOS)}`, toast: ['ok', '✓ Cardápio salvo. Avise o balcão: ele aparece quando a tela de registro for atualizada.'] }) },
    somenteLeitura: { d: 'Data passada: sem ações de edição', o: 'Derivado de RN-50, CA-49', r: () => card(`${datenav('dom 20/09')}<div class="sub"><span>Cardápio de 20/09</span><span class="tag">Somente leitura</span></div>${cardList(HERDADO)}<p class="muted" style="font-size:14px">Cardápios de datas passadas não podem ser alterados.</p>`) },
    somenteLeituraSemProprio: { d: 'Data passada em que nenhum cardápio foi montado (o herdado não é gravado)', o: 'Derivado de RN-08, RN-50', r: () => card(`${datenav('sáb 19/09')}<div class="sub"><span>Cardápio de 19/09</span><span class="tag">Somente leitura</span></div><div class="center"><p class="big">Nenhum cardápio foi montado nesta data.</p><p class="muted">Nesse dia valeu o cardápio herdado da data anterior.</p></div>`) },
    semPermissao: SEMPERM,
  } },
  'UI-09': { nome: 'Catálogo · Proteínas', rota: '/catalogo/proteinas', perfis: ['ADMIN'], rn: 'RN-01, 04, 49, 58, 59', ca: 'CA-29, 62', estados: catalogo(CFG_PROT) },
  'UI-10': { nome: 'Catálogo · Pratos', rota: '/catalogo/pratos', perfis: ['ADMIN'], rn: 'RN-02, 04, 06, 49, 58, 59', ca: 'CA-12, 26, 30, 63', estados: catalogo(CFG_PRATO) },
  'UI-11': { nome: 'Catálogo · Itens de cardápio', rota: '/catalogo/itens', perfis: ['ADMIN'], rn: 'RN-03, 04, 05, 12, 49, 59', ca: 'CA-11, 13, 30, 47, 64', estados: catalogo(CFG_ITEM) },
  'UI-12': { nome: 'Usuários', rota: '/usuarios', perfis: ['ADMIN'], rn: 'RN-34, 37, 52, 60', ca: 'CA-27, 51, 53, 65, 66', estados: {
    carregando: { d: 'Buscando', o: 'Derivado do PRD', r: () => users(skel(4)) },
    default: { d: 'Usuários ativos. Ações: Redefinir senha, Desativar. O próprio ADMIN não tem ações na lista. Só cadastra Operador (RN-34)', o: 'Derivado de RN-34, RN-52', r: () => users(usersList(false)) },
    comBloqueado: { d: 'Operador bloqueado por tentativas: marca com o horário de liberação, para o ADMIN decidir entre esperar e redefinir', o: 'Derivado de RN-52, RN-37', r: () => users(usersList(false, true)) },
    comDesativados: { d: 'Desativados visíveis com Reativar', o: 'Derivado de RN-34, CA-53', r: () => users(usersList(true)) },
    vazio: { d: 'Só existe o ADMIN', o: 'Derivado do PRD', r: () => users(`<div class="center"><p class="big">Nenhum operador cadastrado.</p><p class="muted">Cadastre quem vai registrar vendas no balcão.</p>${btn('Novo operador', go('UI-12', 'formulario'), 'pri')}</div>`) },
    formulario: { d: 'Cadastro de operador: nome, usuário, senha inicial', o: 'Derivado de RN-34', r: () => users(usersList(false), sh(userForm(''))) },
    validacao: { d: 'Usuário (login) já em uso, sem diferenciar maiúsculas', o: 'Derivado de RN-60, CA-65', r: () => users(usersList(false), sh(userForm('validacao'))) },
    senhaCurta: { d: 'Senha inicial com menos de 8 caracteres', o: 'Derivado de RN-60, CA-66', r: () => users(usersList(false), sh(userForm('senhaCurta'))) },
    salvando: { d: 'Salvando', o: 'Derivado do PRD', r: () => users(usersList(false), sh(userForm('salvando'))) },
    erroEnvio: { d: 'Falha; dados preservados', o: 'Derivado de RN-48', r: () => users(usersList(false), sh(userForm('erroEnvio'))) },
    confirmarDesativar: { d: 'Confirma desativação; autoria das vendas preservada', o: 'Derivado de RN-34, CA-27', r: () => users(usersList(false), sh(`<h2>Desativar João?</h2><p>Ele deixa de conseguir entrar. As vendas que ele registrou continuam atribuídas a ele. Você pode reativá-lo depois.</p>${btn('Desativar', go('UI-12', 'sucesso'), 'pri full')}${btn('Voltar', go('UI-12'), 'ghost')}`)) },
    redefinirSenha: { d: 'Nova senha para o operador; desbloqueia a conta e invalida a senha anterior', o: 'Derivado de RN-52, CA-51', r: () => users(usersList(false), sh(`<h2>Redefinir senha de João</h2>${field('Nova senha (mínimo 8 caracteres)', '<input type="password" value="••••••••">')}<p class="muted" style="font-size:14px;margin:0 0 8px">A senha anterior deixa de funcionar e, se a conta estiver bloqueada por tentativas, ela é liberada na hora.</p>${btn('Redefinir senha', go('UI-12', 'redefinirSucesso'), 'pri full')}${btn('Voltar', go('UI-12'), 'ghost')}`)) },
    redefinirSucesso: { d: 'Senha redefinida', o: 'Derivado de CA-51', r: () => users(usersList(false), '', ['ok', '✓ Senha de João redefinida. Entregue a nova senha a ele.']) },
    sucesso: { d: 'Operação concluída', o: 'Derivado do PRD', r: () => users(usersList(false), '', ['ok', '✓ Salvo.']) },
    erro: { d: 'Falha ao carregar', o: 'Derivado de RN-48', r: () => users(erroCarga()) },
    semPermissao: SEMPERM,
  } },
  'UI-13': { nome: 'Trocar minha senha', rota: '/conta/senha', perfis: ['ADMIN'], rn: 'RN-53, 60', ca: 'CA-52, 66', estados: {
    default: { d: 'Senha atual + nova + repetição', o: 'Derivado de RN-53', r: () => shell({ title: 'Minha senha', nav: 'MAIS', body: senhaBody('default') }) },
    validacao: { d: 'Repetição não confere', o: 'Derivado de RN-46', r: () => shell({ title: 'Minha senha', nav: 'MAIS', body: senhaBody('validacao') }) },
    senhaCurta: { d: 'Nova senha com menos de 8 caracteres', o: 'Derivado de RN-60, CA-66', r: () => shell({ title: 'Minha senha', nav: 'MAIS', body: senhaBody('senhaCurta') }) },
    enviando: { d: 'Salvando', o: 'Derivado do PRD', r: () => shell({ title: 'Minha senha', nav: 'MAIS', body: senhaBody('enviando') }) },
    senhaAtualIncorreta: { d: 'Senha atual errada: troca recusada', o: 'Derivado de CA-52', r: () => shell({ title: 'Minha senha', nav: 'MAIS', body: senhaBody('senhaAtualIncorreta') }) },
    sucesso: { d: 'Senha trocada', o: 'Derivado de CA-52', r: () => shell({ title: 'Minha senha', nav: 'MAIS', body: senhaBody('sucesso') }) },
    erroEnvio: { d: 'Falha no servidor', o: 'Derivado de RN-48', r: () => shell({ title: 'Minha senha', nav: 'MAIS', body: senhaBody('erroEnvio') }) },
    semPermissao: SEMPERM,
  } },
};
// Estado inicial de cada tela
Object.values(T).forEach(t => { t.first = t.estados.default ? 'default' : Object.keys(t.estados)[0]; });

/* ---------- Render e controles ---------- */
const $ = id => document.getElementById(id);
function render() {
  const t = T[S.tela];
  let st = S.estado;
  if (t.perfis[0] !== 'todos' && !t.perfis.includes(S.perfil)) st = 'semPermissao';
  if (!t.estados[st]) st = t.first;
  S.estado = st;
  const e = t.estados[st];
  $('screen').innerHTML = e.r();
  const perfilSb = st === 'semPermissao' ? 'Operador' : S.perfil;
  $('sb').textContent = S.disp === 'cel' ? `${S.tela}.${st} · ${perfilSb}` : `pfmarmitas.app${t.rota} · ${S.tela}.${st} · ${perfilSb}`;
  $('selTela').value = S.tela;
  $('selEstado').innerHTML = Object.keys(t.estados).map(k => `<option value="${k}">${S.tela}.${k}</option>`).join('');
  $('selEstado').value = st;
  try { history.replaceState(null, '', `#${S.tela}.${st}@${S.perfil}`); } catch (_) {}
  $('info').innerHTML = `<dt>${S.tela} — ${t.nome}</dt><dd>Rota: <code>${t.rota}</code> · Perfis: ${t.perfis.join(', ')}</dd>
    <dt>Implementa</dt><dd>${t.rn}</dd><dt>Valida</dt><dd>${t.ca}</dd>
    <dt>Estado ${st}</dt><dd>${e.d}</dd><dt>Origem</dt><dd>${e.o}</dd>`;
}
function setEstado(st) {
  S.estado = st;
  const e = T[S.tela].estados[st];
  if (e && e.q) S.qtd = e.q;
}
$('selTela').innerHTML = Object.entries(T).map(([k, t]) => `<option value="${k}">${k} — ${t.nome}</option>`).join('');
$('selTela').addEventListener('change', e => { S.tela = e.target.value; S.mais = false; setEstado(T[S.tela].first); render(); });
$('selEstado').addEventListener('change', e => { S.mais = false; setEstado(e.target.value); render(); });
document.querySelectorAll('input[name=perfil]').forEach(r => r.addEventListener('change', e => { S.perfil = e.target.value; S.mais = false; if (S.estado === 'semPermissao') setEstado(T[S.tela].first); render(); }));
$('chkHerdado').addEventListener('change', e => { S.herdado = e.target.checked; render(); });
const NOTA_DISP = {
  cel: 'Celular de 375 px, o alvo do projeto (mobile first).',
  coluna: 'No computador, a mesma tela numa coluna de até 480 px, centralizada.',
};
function setDisp(d) {
  S.disp = d;
  document.body.classList.toggle('desk', d !== 'cel');
  document.querySelector('.phone').classList.toggle('desk', d !== 'cel');
  $('dispNota').textContent = NOTA_DISP[d];
  render();
}
document.querySelectorAll('input[name=disp]').forEach(r => r.addEventListener('change', e => setDisp(e.target.value)));
$('dispNota').textContent = NOTA_DISP.cel;

$('screen').addEventListener('click', e => {
  const el = e.target.closest('[data-go],[data-act]');
  if (!el || el.disabled) return;
  if (el.dataset.go) {
    if (el.dataset.go === 'MAIS') { S.mais = !S.mais; render(); return; }
    S.mais = false; S.tela = el.dataset.go; setEstado(el.dataset.st || T[S.tela].first); render(); return;
  }
  const a = el.dataset.act;
  if (a === 'abrir') { S.item = { prato: el.dataset.prato, fmt: el.dataset.fmt }; S.qtd = 1; S.tela = 'UI-03'; S.estado = 'default'; }
  else if (a === 'mais') { S.qtd = Math.min(20, S.qtd + 1); S.estado = S.qtd === 20 ? 'limite' : 'ajustando'; }
  else if (a === 'menos') { S.qtd = Math.max(1, S.qtd - 1); S.estado = S.qtd === 1 ? 'default' : 'ajustando'; }
  else if (a === 'confirmar') { S.tela = 'UI-02'; S.estado = 'registrado'; }
  else if (a === 'fechar') { S.tela = 'UI-02'; S.estado = 'default'; S.qtd = 1; }
  else if (a === 'cancelarVenda') { S.tela = 'UI-06'; S.estado = 'confirmacao'; }
  else if (a === 'sair') { S.mais = false; S.tela = 'UI-01'; S.estado = 'saiu'; }
  else if (a === 'entrar') { S.tela = 'UI-02'; S.estado = 'default'; }
  else if (a === 'fecharMais') { S.mais = false; }
  render();
});
// Deep link: #UI-07.default@ADMIN abre direto na tela, estado e perfil
(() => {
  const m = /^#(UI-\d+)(?:\.(\w+))?(?:@(ADMIN|Operador))?$/.exec(location.hash || '');
  if (!m || !T[m[1]]) return;
  S.tela = m[1];
  if (m[3]) { S.perfil = m[3]; document.querySelectorAll('input[name=perfil]').forEach(r => { r.checked = r.value === m[3]; }); }
  setEstado(m[2] || T[S.tela].first);
})();
render();
</script>
