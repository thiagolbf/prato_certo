<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Protótipo PF e Marmitas</title>
<!--
  Wireframe navegável da SPEC-UI-001 (docs/prototype/SPEC-UI-001-controle-vendas-pf-marmitas.md).
  Fidelidade: wireframe — estrutura, campos e estados. Sem tratamento visual final.
  O painel lateral troca tela, estado e perfil; os IDs UI-XX.estado batem com a SPEC-UI.
  Dados de exemplo fictícios, coerentes com os cenários do PRD-001.
-->
<style>
  :root {
    --ink: #111; --muted: #555; --line: #bdbdbd; --soft: #f2f2f2; --paper: #fff; --desk: #e6e6e6;
    --err: #a4001d; --errbg: #fde8ec; --ok: #1d5e20; --okbg: #e5f3e6; --warn: #6b4a00; --warnbg: #fff3d1;
    --info: #1b3f73; --infobg: #e6eefb;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 16px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: var(--ink);
         background: var(--desk); display: flex; gap: 24px; padding: 16px; justify-content: center; align-items: flex-start; flex-wrap: wrap; }
  button, input, select, textarea { font: inherit; color: inherit; }
  #ctl { width: 320px; background: var(--paper); border: 1px solid var(--line); border-radius: 12px; padding: 16px; position: sticky; top: 16px; }
  #ctl h1 { font-size: 18px; margin: 0 0 4px; }
  #ctl label { display: block; margin: 12px 0 4px; font-weight: 600; font-size: 14px; }
  #ctl select { width: 100%; min-height: 40px; border: 1px solid var(--line); border-radius: 8px; padding: 0 8px; background: var(--paper); }
  #ctl fieldset { border: 1px solid var(--line); border-radius: 8px; margin: 12px 0 0; padding: 8px 12px; }
  #ctl fieldset label { display: inline-flex; gap: 6px; margin: 4px 16px 4px 0; font-weight: 400; }
  #ctl .chk { display: flex; gap: 8px; font-weight: 400; align-items: flex-start; }
  #info { margin-top: 16px; font-size: 14px; border-top: 1px solid var(--line); padding-top: 12px; }
  #info dt { font-weight: 600; margin-top: 8px; }
  #info dd { margin: 2px 0 0; color: var(--muted); }
  .phone { width: 375px; height: 740px; background: var(--paper); border: 3px solid #222; border-radius: 28px; overflow: hidden;
           display: flex; flex-direction: column; position: relative; }
  .statebar { background: #222; color: #fff; font: 12px/1 ui-monospace, Consolas, monospace; padding: 8px 14px; }
  .screen { flex: 1; display: flex; flex-direction: column; position: relative; min-height: 0; }
  .top { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 8px 12px; border-bottom: 1px solid var(--line); }
  .top h1 { font-size: 18px; margin: 0; }
  .top .who { font-size: 13px; color: var(--muted); display: block; }
  .content { flex: 1; overflow: auto; padding: 12px; }
  .nav { display: flex; border-top: 1px solid var(--line); }
  .nav button { flex: 1; min-height: 56px; border: 0; background: var(--paper); font-size: 13px; font-weight: 600; border-top: 3px solid transparent; cursor: pointer; }
  .nav button[aria-current="page"] { border-top-color: var(--ink); background: var(--soft); }
  .btn { min-height: 44px; border: 2px solid var(--ink); background: var(--paper); border-radius: 8px; padding: 0 14px; font-weight: 600; cursor: pointer; }
  .btn.pri { background: var(--ink); color: #fff; }
  .btn.ghost { border-color: transparent; text-decoration: underline; }
  .btn.sm { min-height: 36px; padding: 0 10px; font-size: 14px; }
  .btn.xl { min-height: 64px; font-size: 20px; width: 100%; }
  .btn.full { width: 100%; }
  .btn.danger { border-color: var(--err); color: var(--err); }
  .btn.danger.pri { background: var(--err); color: #fff; }
  .btn:disabled { opacity: .45; cursor: not-allowed; }
  .lnk { background: none; border: 0; text-decoration: underline; min-height: 44px; padding: 0 4px; cursor: pointer; font-weight: 600; }
  .banner { border-radius: 8px; padding: 10px 12px; margin: 0 0 12px; border: 2px solid; font-size: 15px; }
  .banner.err { background: var(--errbg); border-color: var(--err); color: var(--err); }
  .banner.ok { background: var(--okbg); border-color: var(--ok); color: var(--ok); }
  .banner.warn { background: var(--warnbg); border-color: var(--warn); color: var(--warn); }
  .banner.info { background: var(--infobg); border-color: var(--info); color: var(--info); }
  .banner .acts { display: flex; gap: 8px; margin-top: 8px; flex-wrap: wrap; }
  .shellbanner { margin: 8px 12px 0; }
  .sub { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 12px; font-weight: 600; }
  .tag { display: inline-block; font-size: 12px; font-weight: 700; padding: 2px 8px; border-radius: 999px; border: 1.5px solid var(--muted); color: var(--muted); white-space: nowrap; }
  .tag.err { border-color: var(--err); color: var(--err); }
  .tag.warn { border-color: var(--warn); color: var(--warn); }
  .muted { color: var(--muted); }
  .center { text-align: center; padding: 32px 8px; }
  .big { font-size: 20px; font-weight: 700; margin: 0 0 8px; }
  .skel { height: 64px; border-radius: 8px; background: repeating-linear-gradient(90deg, #eee 0 40px, #e2e2e2 40px 80px); margin-bottom: 10px; }
  .grade { display: flex; flex-direction: column; gap: 8px; }
  .prato { display: flex; align-items: center; gap: 8px; border: 1px solid var(--line); border-radius: 10px; padding: 8px; }
  .pnome { flex: 1; font-weight: 700; font-size: 17px; }
  .fmts { display: flex; gap: 8px; }
  .item { min-width: 92px; min-height: 64px; border: 2px solid var(--ink); border-radius: 10px; background: var(--paper); font-weight: 700; font-size: 17px; cursor: pointer; }
  .item:disabled { opacity: .4; }
  .item.vago { border: 0; background: none; display: inline-block; }
  .toast { position: absolute; left: 12px; right: 12px; bottom: 68px; padding: 14px; border-radius: 10px; font-weight: 700; border: 2px solid; }
  .toast.ok { background: var(--okbg); border-color: var(--ok); color: var(--ok); }
  .scrim { position: absolute; inset: 0; background: rgba(0,0,0,.45); }
  .sheet { position: absolute; left: 0; right: 0; bottom: 0; background: var(--paper); border-radius: 18px 18px 0 0; padding: 16px; display: flex; flex-direction: column; gap: 10px; max-height: 88%; overflow: auto; }
  .sheet h2 { margin: 0; font-size: 20px; }
  .stepper { display: flex; align-items: center; justify-content: center; gap: 20px; }
  .step { width: 72px; min-height: 72px; font-size: 32px; border-radius: 50%; }
  .qtd { font-size: 44px; font-weight: 800; min-width: 64px; text-align: center; }
  .hint { margin: 0; text-align: center; font-size: 15px; }
  .hint.warn { color: var(--warn); font-weight: 600; }
  .list { list-style: none; margin: 0; padding: 0; }
  .list li { display: flex; gap: 8px; align-items: center; padding: 12px 4px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
  .list .time { font-variant-numeric: tabular-nums; color: var(--muted); width: 44px; }
  .grow { flex: 1; }
  .qty { font-weight: 700; }
  .cancel .grow, .cancel .qty, .cancel .val { text-decoration: line-through; color: var(--muted); }
  .card { border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; margin-bottom: 10px; }
  .card.cancel { background: var(--soft); }
  .card .l1 { display: flex; justify-content: space-between; font-size: 14px; color: var(--muted); }
  .card .l2 { font-weight: 700; margin: 4px 0; }
  .card .l3 { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .card .why { font-size: 14px; color: var(--muted); margin-top: 6px; text-decoration: none; }
  .datenav { display: flex; gap: 8px; margin-bottom: 12px; }
  .datenav .datebtn { flex: 1; }
  .datenav .icon { width: 48px; padding: 0; font-size: 22px; }
  .kpis { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 12px; }
  .kpi.total { grid-column: 1 / -1; }
  .kpi { border: 1px solid var(--line); border-radius: 10px; padding: 8px; }
  .kpi small { display: block; color: var(--muted); font-size: 12px; }
  .kpi strong { font-size: 16px; }
  .kpi.total { border: 2px solid var(--ink); }
  h3 { font-size: 15px; margin: 16px 0 6px; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th, td { text-align: left; padding: 6px 4px; border-bottom: 1px solid var(--line); }
  td.n, th.n { text-align: right; font-variant-numeric: tabular-nums; }
  .field { display: flex; flex-direction: column; gap: 4px; margin-bottom: 12px; }
  .field span { font-weight: 600; font-size: 14px; }
  .field input, .field select, .field textarea { min-height: 44px; border: 2px solid var(--line); border-radius: 8px; padding: 8px 10px; background: var(--paper); }
  .field.bad input, .field.bad textarea, .field.bad select { border-color: var(--err); }
  .field .msg { color: var(--err); font-size: 14px; font-weight: 600; }
  .seg { display: flex; gap: 8px; }
  .seg .btn { flex: 1; }
  .seg .btn[aria-pressed="true"] { background: var(--ink); color: #fff; }
  .tabs { display: flex; gap: 6px; margin-bottom: 12px; }
  .tabs .btn { flex: 1; font-size: 14px; padding: 0 6px; }
  .tabs .btn[aria-current="page"] { background: var(--ink); color: #fff; }
  .rowact { display: flex; gap: 6px; }
  .off .grow { color: var(--muted); }
  .check { display: flex; align-items: center; gap: 10px; min-height: 48px; border-bottom: 1px solid var(--line); }
  .check input { width: 24px; height: 24px; }
  .login { flex: 1; padding: 32px 20px; display: flex; flex-direction: column; justify-content: center; }
  .login h1 { font-size: 24px; margin: 0 0 24px; text-align: center; }
  .menu a, .menu button { display: block; width: 100%; text-align: left; min-height: 48px; border: 0; border-bottom: 1px solid var(--line); background: none; font-weight: 600; cursor: pointer; padding: 0 4px; }
  @media (max-width: 760px) {
    body { padding: 8px; gap: 12px; }
    #ctl { width: 100%; position: static; }
    .phone { width: 100%; height: 700px; }
  }
</style>
</head>
<body>

<aside id="ctl" aria-label="Controles do protótipo">
  <h1>Protótipo · PRD-001</h1>
  <div class="muted" style="font-size:14px">Wireframe navegável · SPEC-UI-001. Estrutura e estados, sem visual final.</div>
  <label for="selTela">Tela</label>
  <select id="selTela"></select>
  <label for="selEstado">Estado</label>
  <select id="selEstado"></select>
  <fieldset>
    <legend>Perfil autenticado</legend>
    <label><input type="radio" name="perfil" value="Operador" checked> Operador</label>
    <label><input type="radio" name="perfil" value="ADMIN"> ADMIN</label>
  </fieldset>
  <label class="chk"><input type="checkbox" id="chkHerdado"> Cardápio de hoje é herdado (aviso global ao ADMIN, RN-09)</label>
  <dl id="info"></dl>
</aside>

<main>
  <div class="phone">
    <div class="statebar" id="sb"></div>
    <div class="screen" id="screen"></div>
  </div>
</main>

<script>
/* ---------- Dados de exemplo (coerentes com os cenários do PRD-001) ---------- */
const HOJE = 'seg 28/09';
const PRATOS = [
  { nome: 'Frango grelhado', prot: 'Frango', g: 150, itens: [['PF', 18], ['Marmita', 22]] },
  { nome: 'Bife acebolado', prot: 'Carne bovina', g: 180, itens: [['PF', 20], ['Marmita', 24]] },
  { nome: 'Peixe frito', prot: 'Peixe', g: 160, itens: [['PF', 21]] },
  { nome: 'Omelete', prot: 'Ovo', g: 120, itens: [['PF', 15], ['Marmita', 18]] },
];
const HERDADO = [
  { nome: 'Frango grelhado', itens: [['PF', 18], ['Marmita', 22]] },
  { nome: 'Bife acebolado', itens: [['PF', 20]] },
  { nome: 'Omelete', itens: [['PF', 15]] },
];
const MINHAS = [['11:58', 'Frango grelhado', 'PF', 1], ['11:52', 'Bife acebolado', 'Marmita', 2], ['11:40', 'Omelete', 'PF', 1], ['11:31', 'Frango grelhado', 'Marmita', 3]];
const VENDAS = [
  ['12:04', 'Maria', 'Frango grelhado', 'PF', 2, 18], ['11:58', 'João', 'Frango grelhado', 'PF', 1, 18],
  ['11:52', 'João', 'Bife acebolado', 'Marmita', 2, 24], ['11:40', 'Maria', 'Omelete', 'PF', 1, 15],
  ['11:31', 'João', 'Frango grelhado', 'Marmita', 3, 22],
];
const FECH_HOJE = [['Frango grelhado', 'Frango', 150, 'PF', 10, 18], ['Frango grelhado', 'Frango', 150, 'Marmita', 4, 22], ['Bife acebolado', 'Carne bovina', 180, 'PF', 6, 20]];
const FECH_1509 = [['Frango grelhado', 'Frango', 150, 'PF', 22, 17], ['Feijoada', 'Carne suína', 200, 'PF', 18, 22], ['Feijoada', 'Carne suína', 200, 'Marmita', 12, 26], ['Omelete', 'Ovo', 120, 'PF', 26, 15]];

const S = { tela: 'UI-02', estado: 'default', perfil: 'Operador', herdado: false, item: { prato: 'Frango grelhado', fmt: 'PF' }, qtd: 1, mais: false };

/* ---------- Helpers ---------- */
const brl = v => 'R$ ' + v.toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
// Gramas como no PRD; kg ao lado porque é a unidade em que a proteína é comprada
const gr = v => v.toLocaleString('pt-BR') + ' g' + (v >= 1000 ? ` <span class="muted">(${(v / 1000).toLocaleString('pt-BR', { maximumFractionDigits: 1 })} kg)</span>` : '');
const go = (t, st = 'default') => `data-go="${t}" data-st="${st}"`;
const btn = (label, attrs = '', cls = '') => `<button class="btn ${cls}" ${attrs}>${label}</button>`;
const banner = (tipo, html) => `<div class="banner ${tipo}" role="${tipo === 'err' ? 'alert' : 'status'}">${html}</div>`;
const skel = n => Array.from({ length: n }, () => '<div class="skel"></div>').join('');
const isAdmin = () => S.perfil === 'ADMIN';
const erroCarga = (o) => `<div class="center">${banner('err', 'Não foi possível carregar. Verifique a conexão e tente de novo.')}${btn('Tentar de novo', go(S.tela))}</div>`;
const datenav = (label, prox = true) => `<div class="datenav"><button class="btn icon" aria-label="Dia anterior">‹</button><button class="btn datebtn" aria-label="Escolher data">${label}</button><button class="btn icon" aria-label="Próximo dia" ${prox ? '' : 'disabled'}>›</button></div>`;
const field = (label, input, msg) => `<label class="field ${msg ? 'bad' : ''}"><span>${label}</span>${input}${msg ? `<span class="msg">${msg}</span>` : ''}</label>`;

function shell(o) {
  const p = o.perfil || S.perfil;
  const who = p === 'ADMIN' ? 'Carla · ADMIN' : 'João · Operador';
  const showBanner = p === 'ADMIN' && !o.noBanner && (S.herdado || o.forceBanner);
  const nav = p === 'ADMIN'
    ? [['UI-02', 'Registrar'], ['UI-05', 'Vendas'], ['UI-07', 'Fechamento'], ['UI-08', 'Cardápio'], ['MAIS', 'Mais']]
    : [['UI-02', 'Registrar'], ['UI-04', 'Minhas vendas']];
  const cur = o.nav || S.tela;
  return `<header class="top"><div><h1>${o.title}</h1><span class="who">${who}</span></div><button class="lnk" data-act="sair">Sair</button></header>
    ${showBanner ? `<div class="shellbanner">${banner('warn', `<strong>Cardápio de hoje herdado de sáb 26/09.</strong> Revise ou confirme. <div class="acts">${btn('Revisar cardápio', go('UI-08', 'herdado'), 'sm')}</div>`)}</div>` : ''}
    <div class="content">${o.body}</div>
    ${o.toast ? `<div class="toast ${o.toast[0]}" role="status">${o.toast[1]}</div>` : ''}
    <nav class="nav" aria-label="Navegação principal">${nav.map(([t, l]) => `<button ${t === 'MAIS' ? 'data-go="MAIS"' : go(t)} ${t === cur ? 'aria-current="page"' : ''}>${l}</button>`).join('')}</nav>
    ${o.overlay || ''}
    ${S.mais && p === 'ADMIN' ? menuMais() : ''}`;
}

function menuMais() {
  const it = [['UI-04', 'Minhas vendas de hoje'], ['UI-09', 'Catálogo · Proteínas'], ['UI-10', 'Catálogo · Pratos'], ['UI-11', 'Catálogo · Itens de cardápio'], ['UI-12', 'Usuários'], ['UI-13', 'Trocar minha senha']];
  return `<div class="scrim" data-act="fecharMais"></div><div class="sheet menu" role="dialog" aria-label="Mais opções">
    ${it.map(([t, l]) => `<button ${go(t)}>${l}</button>`).join('')}<button data-act="sair">Sair</button></div>`;
}

function semPerm() {
  return shell({ perfil: 'Operador', title: 'Acesso negado', nav: '-', body: `<div class="center"><p class="big">Você não tem acesso a esta tela.</p><p class="muted">Ela é exclusiva do responsável.</p>${btn('Voltar ao registro', go('UI-02'), 'pri')}</div>` });
}
const SEMPERM = { d: 'Operador acessa a rota diretamente (CA-26). Tela inteira bloqueada; o menu do Operador nem mostra o link', o: 'Derivado de CA-26, RN-39', r: semPerm };

/* ---------- UI-02 / UI-03 ---------- */
function grade(pratos = PRATOS, disabled = false) {
  // Colunas fixas (PF sempre à esquerda, Marmita à direita): o polegar aprende a posição
  const slot = (p, f) => p.itens.some(([x]) => x === f)
    ? `<button class="item" data-act="abrir" data-prato="${p.nome}" data-fmt="${f}" ${disabled ? 'disabled' : ''}>${f}</button>`
    : '<span class="item vago" aria-hidden="true"></span>';
  return `<div class="grade">${pratos.map(p => `<div class="prato"><span class="pnome">${p.nome}</span><span class="fmts">${slot(p, 'PF')}${slot(p, 'Marmita')}</span></div>`).join('')}</div>`;
}
const subReg = (extra = '') => `<div class="sub"><span>Cardápio de hoje · ${HOJE}</span>${extra}</div>`;
const reg = (body, extra = {}) => shell(Object.assign({ title: 'Registrar venda', nav: 'UI-02', body }, extra));
const itemTxt = () => `${S.qtd}× ${S.item.prato} · ${S.item.fmt}`;

function painel() {
  const q = S.qtd;
  return `<div class="scrim"></div><div class="sheet" role="dialog" aria-label="Confirmar venda">
    <span class="muted">Confirmar venda</span><h2>${S.item.prato} · ${S.item.fmt}</h2>
    <div class="stepper"><button class="btn step" data-act="menos" ${q <= 1 ? 'disabled' : ''} aria-label="Diminuir quantidade">−</button>
    <output class="qtd" aria-live="polite">${q}</output>
    <button class="btn step" data-act="mais" ${q >= 20 ? 'disabled' : ''} aria-label="Aumentar quantidade">+</button></div>
    ${q >= 20 ? '<p class="hint warn">Máximo de 20 por lançamento. Para mais, confirme este e faça outro lançamento.</p>' : `<p class="hint muted">${q === 1 ? '1 unidade' : q + ' unidades'}</p>`}
    ${btn('Confirmar', 'data-act="confirmar"', 'pri xl')}
    ${btn('Cancelar', 'data-act="fechar"', 'ghost')}</div>`;
}

/* ---------- UI-05 / UI-06 ---------- */
function vendasBody(cancIdx = -1, cancTxt = 'por Carla às 12:10 · motivo: lançado em dobro') {
  const ativos = VENDAS.filter((_, i) => i !== cancIdx);
  const un = ativos.reduce((s, v) => s + v[4], 0), val = ativos.reduce((s, v) => s + v[4] * v[5], 0);
  return `${datenav(HOJE, false)}
    <div class="sub"><span>${VENDAS.length} lançamentos${cancIdx >= 0 ? ' · 1 cancelado' : ''}</span><span>${un} un. · ${brl(val)}</span></div>
    <p class="muted" style="margin-top:-8px;font-size:13px">Totais sem as canceladas.</p>
    ${VENDAS.map((v, i) => { const c = i === cancIdx; return `<div class="card ${c ? 'cancel' : ''}">
      <div class="l1"><span>${v[0]} · ${v[1]}</span>${c ? '<span class="tag err">Cancelada</span>' : ''}</div>
      <div class="l2 ${c ? 'grow' : ''}">${v[2]} · ${v[3]}</div>
      <div class="l3"><span class="val">${v[4]} × ${brl(v[5])} = <strong>${brl(v[4] * v[5])}</strong></span>${c ? '' : btn('Cancelar venda', `data-act="cancelarVenda"`, 'sm danger')}</div>
      ${c ? `<div class="why">Cancelada ${cancTxt}</div>` : ''}</div>`; }).join('')}`;
}
const vendas = (body, extra = {}) => shell(Object.assign({ title: 'Vendas da data', nav: 'UI-05', body }, extra));
function dlgCancelar(st) {
  const v = VENDAS[1];
  const motivo = st === 'validacao' ? '' : 'cliente desistiu';
  const busy = st === 'processando';
  return `<div class="scrim"></div><div class="sheet" role="dialog" aria-label="Cancelar venda">
    <h2>Cancelar venda?</h2>
    <div class="card"><div class="l1"><span>${v[0]} · ${v[1]}</span></div><div class="l2">${v[2]} · ${v[3]}</div><div>${v[4]} × ${brl(v[5])} = <strong>${brl(v[4] * v[5])}</strong></div></div>
    <p class="muted" style="margin:0;font-size:14px">A venda inteira sai dos totais e continua no histórico, marcada como cancelada. Para corrigir a quantidade, cancele e registre de novo.</p>
    ${st === 'jaCancelada' ? banner('err', 'Esta venda já foi cancelada por Carla às 12:10 (motivo: lançado em dobro). Nada foi alterado.') : ''}
    ${st === 'erro' ? banner('err', 'Não foi possível cancelar. Verifique a conexão e tente de novo. O motivo digitado foi mantido.') : ''}
    ${st === 'jaCancelada' ? btn('Voltar à lista', go('UI-05', 'comCancelada'), 'pri full') : `
      ${field('Motivo (obrigatório)', `<textarea rows="2" ${busy ? 'disabled' : ''}>${motivo}</textarea>`, st === 'validacao' ? 'Informe o motivo do cancelamento.' : '')}
      ${btn(busy ? 'Cancelando…' : 'Cancelar venda', `${busy ? 'disabled' : ''} ${go('UI-06', 'sucesso')}`, 'danger pri full')}
      ${btn('Voltar', `${busy ? 'disabled' : ''} ${go('UI-05')}`, 'ghost')}`}
  </div>`;
}

/* ---------- UI-07 ---------- */
// Mês de exemplo: setembro/2026 até hoje (28/09), sem domingos. Gerado dia a dia para que
// a quebra por dia some exatamente o total do mês.
const MES = (() => {
  const wdN = ['dom', 'seg', 'ter', 'qua', 'qui', 'sex', 'sáb'], dias = [], itens = {};
  for (let d = 1; d <= 28; d++) {
    const wd = (d + 1) % 7; // 01/09/2026 é terça
    if (wd === 0) continue;
    const vendas = [
      ['Frango grelhado', 'Frango', 150, 'PF', 8 + (d * 3) % 6, 18], ['Frango grelhado', 'Frango', 150, 'Marmita', 3 + d % 4, 22],
      ['Bife acebolado', 'Carne bovina', 180, 'PF', 4 + (d * 7) % 5, 20], ['Bife acebolado', 'Carne bovina', 180, 'Marmita', 2 + d % 3, 24],
      ['Peixe frito', 'Peixe', 160, 'PF', wd === 5 ? 12 : 3 + d % 2, 21],
      ['Omelete', 'Ovo', 120, 'PF', 2 + d % 3, 15], ['Omelete', 'Ovo', 120, 'Marmita', 1 + d % 2, 18],
    ];
    let un = 0, fat = 0;
    vendas.forEach(v => { un += v[4]; fat += v[4] * v[5]; const k = v[0] + '|' + v[3]; itens[k] = itens[k] ? (itens[k][4] += v[4], itens[k]) : v.slice(); });
    dias.push([`${wdN[wd]} ${String(d).padStart(2, '0')}/09`, un, fat]);
  }
  return { dias: dias.reverse(), itens: Object.values(itens) };
})();
const modoSeg = (modo) => `<div class="seg" style="margin-bottom:12px" role="group" aria-label="Período"><button class="btn" ${go('UI-07', 'default')} aria-pressed="${modo === 'dia'}">Dia</button><button class="btn" ${go('UI-07', 'mes')} aria-pressed="${modo === 'mes'}">Mês</button></div>`;
const porDia = () => `<h3>Por dia</h3><table><thead><tr><th>Dia</th><th class="n">Unid.</th><th class="n">Faturamento</th></tr></thead><tbody>${MES.dias.map(([l, u, f]) => `<tr ${go('UI-07', 'dataPassada')} style="cursor:pointer"><td><u>${l}</u></td><td class="n">${u}</td><td class="n">${brl(f)}</td></tr>`).join('')}</tbody></table>`;

function fechBody(dados, label, prox, extraTop = '', modo = 'dia') {
  let fPF = 0, fM = 0, uPF = 0, uM = 0; const prot = {}, porPrato = {}, porItem = [];
  dados.forEach(([p, pr, g, f, q, v]) => {
    if (f === 'PF') { fPF += q * v; uPF += q; } else { fM += q * v; uM += q; }
    prot[pr] = (prot[pr] || 0) + g * q;
    porPrato[p] = porPrato[p] || { PF: 0, Marmita: 0 }; porPrato[p][f] += q;
    porItem.push([p, f, q]);
  });
  return `${modoSeg(modo)}${datenav(label, prox)}${extraTop}
    <h3>Faturamento</h3>
    <div class="kpis"><div class="kpi"><small>PF</small><strong>${brl(fPF)}</strong></div><div class="kpi"><small>Marmita</small><strong>${brl(fM)}</strong></div><div class="kpi total"><small>Total</small><strong>${brl(fPF + fM)}</strong></div></div>
    <h3>Unidades</h3>
    <div class="kpis"><div class="kpi"><small>PF</small><strong>${uPF}</strong></div><div class="kpi"><small>Marmita</small><strong>${uM}</strong></div><div class="kpi total"><small>Total</small><strong>${uPF + uM}</strong></div></div>
    <h3>Proteína consumida (estimada)</h3>
    <table><thead><tr><th>Proteína</th><th class="n">Consumo</th></tr></thead><tbody>${Object.entries(prot).map(([k, v]) => `<tr><td>${k}</td><td class="n">${gr(v)}</td></tr>`).join('')}</tbody></table>
    <h3>Por prato</h3>
    <table><thead><tr><th>Prato</th><th class="n">PF</th><th class="n">Marm.</th><th class="n">Total</th></tr></thead><tbody>${Object.entries(porPrato).map(([k, v]) => `<tr><td>${k}</td><td class="n">${v.PF}</td><td class="n">${v.Marmita}</td><td class="n"><strong>${v.PF + v.Marmita}</strong></td></tr>`).join('')}</tbody></table>
    <h3>Por item de cardápio</h3>
    <table><thead><tr><th>Item</th><th class="n">Unid.</th></tr></thead><tbody>${porItem.map(([p, f, q]) => `<tr><td>${p} · ${f}</td><td class="n">${q}</td></tr>`).join('')}</tbody></table>
    ${modo === 'mes' ? porDia() : `<p style="margin-top:16px">${btn('Ver vendas desta data', go('UI-05'), 'full')}</p>`}`;
}

// Estado inicial de cada tela
Object.values(T).forEach(t => { t.first = t.estados.default ? 'default' : Object.keys(t.estados)[0]; });

/* ---------- Render e controles ---------- */
const $ = id => document.getElementById(id);
function render() {
  const t = T[S.tela];
  let st = S.estado;
  if (t.perfis[0] !== 'todos' && !t.perfis.includes(S.perfil)) st = 'semPermissao';
  if (!t.estados[st]) st = t.first;
  S.estado = st;
  const e = t.estados[st];
  $('screen').innerHTML = e.r();
  $('sb').textContent = `${S.tela}.${st} · ${st === 'semPermissao' ? 'Operador' : S.perfil}`;
  $('selTela').value = S.tela;
  $('selEstado').innerHTML = Object.keys(t.estados).map(k => `<option value="${k}">${S.tela}.${k}</option>`).join('');
  $('selEstado').value = st;
  try { history.replaceState(null, '', `#${S.tela}.${st}@${S.perfil}`); } catch (_) {}
  $('info').innerHTML = `<dt>${S.tela} — ${t.nome}</dt><dd>Rota: <code>${t.rota}</code> · Perfis: ${t.perfis.join(', ')}</dd>
    <dt>Implementa</dt><dd>${t.rn}</dd><dt>Valida</dt><dd>${t.ca}</dd>
    <dt>Estado ${st}</dt><dd>${e.d}</dd><dt>Origem</dt><dd>${e.o}</dd>`;
}
function setEstado(st) {
  S.estado = st;
  const e = T[S.tela].estados[st];
  if (e && e.q) S.qtd = e.q;
}
$('selTela').innerHTML = Object.entries(T).map(([k, t]) => `<option value="${k}">${k} — ${t.nome}</option>`).join('');
$('selTela').addEventListener('change', e => { S.tela = e.target.value; S.mais = false; setEstado(T[S.tela].first); render(); });
$('selEstado').addEventListener('change', e => { S.mais = false; setEstado(e.target.value); render(); });
document.querySelectorAll('input[name=perfil]').forEach(r => r.addEventListener('change', e => { S.perfil = e.target.value; S.mais = false; if (S.estado === 'semPermissao') setEstado(T[S.tela].first); render(); }));
$('chkHerdado').addEventListener('change', e => { S.herdado = e.target.checked; render(); });

$('screen').addEventListener('click', e => {
  const el = e.target.closest('[data-go],[data-act]');
  if (!el || el.disabled) return;
  if (el.dataset.go) {
    if (el.dataset.go === 'MAIS') { S.mais = !S.mais; render(); return; }
    S.mais = false; S.tela = el.dataset.go; setEstado(el.dataset.st || T[S.tela].first); render(); return;
  }
  const a = el.dataset.act;
  if (a === 'abrir') { S.item = { prato: el.dataset.prato, fmt: el.dataset.fmt }; S.qtd = 1; S.tela = 'UI-03'; S.estado = 'default'; }
  else if (a === 'mais') { S.qtd = Math.min(20, S.qtd + 1); S.estado = S.qtd === 20 ? 'limite' : 'ajustando'; }
  else if (a === 'menos') { S.qtd = Math.max(1, S.qtd - 1); S.estado = S.qtd === 1 ? 'default' : 'ajustando'; }
  else if (a === 'confirmar') { S.tela = 'UI-02'; S.estado = 'registrado'; }
  else if (a === 'fechar') { S.tela = 'UI-02'; S.estado = 'default'; S.qtd = 1; }
  else if (a === 'cancelarVenda') { S.tela = 'UI-06'; S.estado = 'confirmacao'; }
  else if (a === 'sair') { S.mais = false; S.tela = 'UI-01'; S.estado = 'saiu'; }
  else if (a === 'entrar') { S.tela = 'UI-02'; S.estado = 'default'; }
  else if (a === 'fecharMais') { S.mais = false; }
  render();
});
// Deep link: #UI-07.default@ADMIN abre direto na tela, estado e perfil
(() => {
  const m = /^#(UI-\d+)(?:\.(\w+))?(?:@(ADMIN|Operador))?$/.exec(location.hash || '');
  if (!m || !T[m[1]]) return;
  S.tela = m[1];
  if (m[3]) { S.perfil = m[3]; document.querySelectorAll('input[name=perfil]').forEach(r => { r.checked = r.value === m[3]; }); }
  setEstado(m[2] || T[S.tela].first);
})();
render();
</script>
</body>
</html>
